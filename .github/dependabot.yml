version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Expo SDK pins exact versions of expo-*, React, React Native and the
    # native libraries around them (reanimated, worklets, screens, svg…), and
    # Dependabot can't see those pins: its "patch" PRs moved native modules
    # past what SDK 57 expects. That family is kept in step with
    # `npx expo install --fix` during planned SDK maintenance instead.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@bacons/apple-targets'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
